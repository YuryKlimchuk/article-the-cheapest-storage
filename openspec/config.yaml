# AgentCraft — OpenSpec configuration.
# Workflow schema: proposal → specs → design → tasks.
schema: spec-driven

# Project context is injected into every artifact instruction.
# Fill in for the specific project when installing AgentCraft.
# Keep here only what the agent cannot derive from code, and constraints
# that affect artifacts and the workflow. Keep code-derivable facts out.
context: |
  # Project: "the cheapest storage" — a benchmark for choosing the most
  # disk-efficient storage for audit logs (records of user actions in a system).
  # The results will be published as a Medium article, so the comparison must
  # be reproducible, fairly configured for every engine, and documented well
  # enough for readers to follow (methodology, configs, measurements).
  #
  # Goal: measure and compare on-disk footprint of each candidate storage
  # engine for the same audit-log dataset, to pick the cheapest option.
  #
  # Candidate engines under comparison: PostgreSQL, TimescaleDB (TSDB),
  # MongoDB, ClickHouse, MinIO, and optionally Ceph.
  #
  # Comparison metric: on-disk size (bytes) per dataset size.
  # Dataset sizes: 100K, 1M, 3M, 10M, 50M, 100M records.
  #
  # Approach: a reproducible test bench (containers via Docker Compose) plus
  # benchmark tooling that generates a fixed audit-log dataset, loads it into
  # each engine, and measures disk usage.
  #
  # Constraints: comparisons must use the same input dataset and same
  # hardware/container environment so disk-size numbers are comparable.

rules:
  proposal:
    - Describe why, what changes, capabilities, impact, and non-goals.
    - State goals, boundaries, and success criteria of the change.
    - Respect the existing architecture and previously made decisions.
  specs:
    - Formulate requirements atomically, with a SHALL/MUST modal verb.
    - Accompany each non-trivial requirement with a Scenario (WHEN/THEN).
    - Cover errors and edge cases.
  design:
    - Explain architectural decisions (D1, D2...), dependencies, and trade-offs.
    - Use Mermaid for non-trivial interaction diagrams.
  tasks:
    - Break implementation into verifiable tasks.
    - Include tests and architectural checks.

operations:
  apply:
    guidance:
      - Implement tasks one by one, recording progress.
      - Run build and tests after significant changes.
      - The Test plan (test-plan.md) must be approved before implementation.
  archive:
    guidance:
      - Ensure all tasks are closed and checks passed.
      - Briefly describe the outcome before finishing.
